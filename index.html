<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0420">
<title>PIXEL ARCADE - 미니게임 오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
<style>
:root{
  --bg:#0a0420; --panel:#140a35; --line:#2c1c66;
  --cyan:#00f0ff; --mag:#ff2bd6; --yel:#ffe600; --grn:#39ff14; --red:#ff4d4d; --txt:#e8e6ff; --dim:#8f87c4;
  --px:'Press Start 2P','Galmuri11','Galmuri9',monospace;
  --kr:'Galmuri11','Galmuri9','DungGeunMo','Malgun Gothic',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:contain;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{
  background:
    linear-gradient(rgba(255,43,214,.05) 1px,transparent 1px) 0 0/100% 32px,
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px) 0 0/32px 100%,
    radial-gradient(ellipse at 50% 0%,#24105c 0%,var(--bg) 60%);
  background-color:var(--bg);
  color:var(--txt); font-family:var(--kr); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:none; overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- CRT overlay ---------- */
.crt{position:fixed;inset:0;pointer-events:none;z-index:1000;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px);
  animation:flicker 5s infinite steps(1)}
.crt::after{content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:.93}48%{opacity:1}81%{opacity:.96}82%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.crt{animation:none}.blink{animation:none!important}}

/* ---------- common ---------- */
.screen{display:none;min-height:100vh;min-height:100dvh;max-width:1000px;margin:0 auto;
  padding:max(20px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(60px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen.active{display:block}
.neon-c{color:var(--cyan);text-shadow:0 0 6px var(--cyan),0 0 18px rgba(0,240,255,.6)}
.neon-m{color:var(--mag);text-shadow:0 0 6px var(--mag),0 0 18px rgba(255,43,214,.6)}
.neon-y{color:var(--yel);text-shadow:0 0 6px var(--yel),0 0 18px rgba(255,230,0,.5)}
.blink{animation:blink 1s infinite steps(1)}
.btn{font-family:var(--px);font-size:11px;padding:11px 14px;background:#1b0f47;border:2px solid var(--cyan);
  color:var(--cyan);box-shadow:0 4px 0 #063a55,0 0 10px rgba(0,240,255,.35);text-transform:uppercase;letter-spacing:1px}
.btn:hover{background:#24146a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #063a55}
.btn.mag{border-color:var(--mag);color:var(--mag);box-shadow:0 4px 0 #5a0d4b,0 0 10px rgba(255,43,214,.35)}
.btn.yel{border-color:var(--yel);color:var(--yel);box-shadow:0 4px 0 #5e5500,0 0 10px rgba(255,230,0,.35)}
.btn.on{background:var(--cyan);color:#051025}
.btn.kr{font-family:var(--kr);font-size:14px;letter-spacing:0}
.btn:focus-visible,.tile:focus-visible,.ms-cell:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- intro ---------- */
#intro{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;gap:34px}
#intro.active{display:flex}
#intro h1{font-family:var(--px);font-size:clamp(26px,7vw,60px);margin:0;line-height:1.35}
#intro .sub{font-family:var(--px);font-size:clamp(9px,2vw,13px);color:var(--dim);letter-spacing:2px}
#intro .coin{font-family:var(--px);font-size:clamp(14px,3.4vw,24px)}
#intro .credit{font-family:var(--px);font-size:11px;color:var(--grn)}

/* ---------- home ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.logo{font-family:var(--px);font-size:clamp(15px,3.6vw,24px);margin:0}
.badge{font-family:var(--px);font-size:8px;padding:5px 7px;border:1px solid var(--grn);color:var(--grn)}
.badge.off{border-color:var(--red);color:var(--red)}
.badge.local{border-color:var(--dim);color:var(--dim)}
.cabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.cab{background:linear-gradient(#1c0f4d,#0f0730);border:3px solid var(--line);border-radius:14px 14px 6px 6px;
  padding:0 0 16px;display:flex;flex-direction:column;box-shadow:0 8px 0 #05021a,0 0 22px rgba(0,0,0,.6)}
.cab .marquee{font-family:var(--px);font-size:11px;text-align:center;padding:13px 6px;border-bottom:3px solid var(--line);
  border-radius:10px 10px 0 0;background:#070318;letter-spacing:1px}
.cab .scr{margin:14px 14px 10px;background:#030110;border:3px solid #000;border-radius:8px;padding:16px 10px;text-align:center;
  box-shadow:inset 0 0 26px rgba(0,240,255,.14)}
.cab .ico{font-size:40px;line-height:1.2;height:52px}
.cab h3{margin:6px 0 4px;font-size:21px;font-family:var(--kr)}
.cab p{margin:0;color:var(--dim);font-size:13px;min-height:40px}
.cab .btn{margin:6px 14px 14px}
.cab .lb{margin:0 14px;border-top:2px dashed var(--line);padding-top:10px}
.lb h4{font-family:var(--px);font-size:10px;margin:0 0 8px;color:var(--yel);text-align:center;letter-spacing:1px}
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:34px 1fr auto auto;gap:6px;align-items:center;padding:4px 2px;font-size:14px;border-bottom:1px solid rgba(255,255,255,.05)}
.lb li .rk{font-family:var(--px);font-size:9px;color:var(--dim)}
.lb li:nth-child(1) .rk{color:var(--yel)} .lb li:nth-child(2) .rk{color:#cfd8ff} .lb li:nth-child(3) .rk{color:#ff9d57}
.lb li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li .df{font-family:var(--px);font-size:7px;color:var(--mag)}
.lb li .sc{font-family:var(--px);font-size:10px;color:var(--cyan)}
.lb li.empty{color:#4b4380}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:12px}
/* 광고 자리: 광고 코드가 없을 때는 점선 상자로 자리만 표시 */
.ad-slot{position:relative;margin:0 auto 18px;max-width:728px;min-height:90px;display:flex;align-items:center;justify-content:center;
  border:2px dashed #3a2f6e;border-radius:6px;background:rgba(10,4,32,.55);color:#6c62a0;font-size:12px;text-align:center;overflow:hidden}
.ad-slot::before{content:"AD";position:absolute;top:5px;left:7px;font-family:var(--px);font-size:8px;color:#6c62a0}
.ad-slot.filled{border:0;background:none}
.ad-slot.filled::before{display:none}
.ad-slot.off{display:none}
.mbox .ad-slot{min-height:60px;margin:0 0 16px}
/* 전면 광고 (광고 서비스 연결 전 확인용) */
.ad-inter{position:fixed;inset:0;z-index:950;background:rgba(3,1,14,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
.ad-inter .ad-inter-box{width:min(100%,336px);min-height:280px;margin:0}
.ad-inter-close{min-width:150px;min-height:48px;font-size:12px}
.ad-inter-close:disabled{opacity:.5;cursor:default}
@media (max-width:560px){ .ad-slot{min-height:100px;margin-bottom:14px} .mbox .ad-slot{min-height:56px} }

/* ---------- game screen ---------- */
.ghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ghead h2{font-family:var(--kr);font-size:24px;margin:0;flex:1;min-width:140px}
.help{color:var(--dim);font-size:13px;margin:0 0 12px}
.help summary{cursor:pointer;color:var(--cyan);padding:4px 0;width:max-content}
.help p{margin:4px 0 0}
.diffs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.hud div{background:#050214;border:2px solid var(--line);padding:8px 6px;text-align:center}
.hud small{display:block;font-family:var(--px);font-size:8px;color:var(--dim);margin-bottom:6px}
.hud b{font-family:var(--px);font-size:clamp(11px,3vw,16px);color:var(--grn);text-shadow:0 0 8px rgba(57,255,20,.6);font-weight:400}
#stage{position:relative;background:#050214;border:3px solid var(--line);border-radius:8px;padding:14px 8px;min-height:240px;
  box-shadow:inset 0 0 40px rgba(0,240,255,.08)}
/* 일시정지 화면: 판을 완전히 가린다 */
.pause-ov{position:absolute;inset:0;z-index:30;background:rgba(5,2,20,.97);border-radius:6px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.pause-ov .pz-t{font-family:var(--px);font-size:clamp(20px,5vw,32px)}
.pause-ov .pz-s{margin:0;color:var(--dim);font-size:14px}
.pause-ov .pz-b{min-width:200px;min-height:52px;font-size:13px}
#pauseBtn{min-width:46px}
#pauseBtn:disabled{opacity:.35;cursor:default}
.mbox .share{display:block;width:100%;margin-top:10px}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;font-family:var(--px);font-size:10px;
  background:#000;border:2px solid var(--yel);color:var(--yel);padding:8px 10px;white-space:nowrap;animation:pop .15s}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* ---------- baseball ---------- */
.bb{max-width:760px;margin:0 auto}
/* 야구장 장면: 타자 뒤편 시점, 왼쪽에 전광판 */
.bb-scene{position:relative;aspect-ratio:1024/559;overflow:hidden;border:4px solid #000;border-radius:4px;margin:0 auto 12px;background:#5c94fc;
  max-width:max(300px,calc(44vh * 1.83))} /* 장면과 입력판이 한 화면에 들어오도록 높이를 제한 */
.bb-scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 장면 이미지에 S/B/O 전광판이 있으므로 별도 전광판은 숨긴다 */
.bb-board{display:none!important}
/* 판정 배너: 화면 위쪽을 가로지르는 어두운 띠 */
.bb-call{position:absolute;left:0;right:0;top:24%;z-index:3;text-align:center;padding:1.6% 0;
  font-family:var(--px);font-weight:400;font-size:clamp(11px,3.4cqw,26px);letter-spacing:.04em;color:#fff;
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(10,12,16,.82) 22%,rgba(10,12,16,.82) 78%,rgba(0,0,0,0) 100%);
  text-shadow:0 2px 3px rgba(0,0,0,.7);white-space:nowrap;opacity:0;pointer-events:none}
.bb-call.show{animation:bbband 1.3s ease-out forwards}
@keyframes bbband{0%{opacity:0;transform:scaleY(.2)}12%{opacity:1;transform:scaleY(1)}82%{opacity:1}100%{opacity:0}}
/* 구속 표시: 화면 아래 가운데 */
.bb-speed{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:3;padding:.6cqw 2cqw;border-radius:1cqw;
  background:rgba(12,14,18,.78);border:1px solid rgba(255,255,255,.35);color:#f3d55b;font-family:var(--px),'Malgun Gothic',sans-serif;
  font-weight:700;font-size:clamp(10px,2.3cqw,16px);white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.bb-speed.show{opacity:1}
.bb-board{position:absolute;left:3%;top:6%;width:31%;background:#101010;border:3px solid #f8f8f8;border-radius:0;padding:6px;
  font-family:var(--px);box-shadow:4px 4px 0 rgba(0,0,0,.45);z-index:2}
.bb-board::after{content:"";position:absolute;left:16%;right:16%;top:100%;height:200px;margin-top:3px;display:none}
.bb-bh{font-size:clamp(6px,1.3vw,9px);color:#f8f8f8;text-align:center;letter-spacing:1px}
.bb-led{font-size:clamp(11px,2.6vw,20px);color:#f8b800;text-align:center;letter-spacing:.2em;margin:5px 0 7px;padding-left:.2em;
  background:#000;border:1px solid #585858;padding-top:4px;padding-bottom:4px}
.bb-row{display:flex;align-items:center;gap:clamp(4px,.9vw,8px);margin-top:clamp(3px,.7vw,7px)}
.bb-row b{font-size:clamp(10px,2.1vw,16px);width:1.3em;color:#fff;font-weight:400}
.lamp{width:clamp(10px,2.3vw,19px);aspect-ratio:1;border-radius:50%;background:#383838;border:1px solid #000}
.lamp.on.s{background:#f8d800;box-shadow:0 0 6px #f8d800}
.lamp.on.b{background:#58d854;box-shadow:0 0 6px #58d854}
.lamp.on.o{background:#f83800;box-shadow:0 0 6px #f83800}
.bb-ctl{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"log slots" "log pad";gap:0 14px;align-items:start}
.bb-ctl .bb-slots{grid-area:slots} .bb-ctl .bb-log{grid-area:log;height:100%;min-height:190px;margin:0} .bb-ctl .bb-pad{grid-area:pad}
.bb-scene{container-type:inline-size}
.bb-board{left:auto;right:2.5%;top:4%;width:22%;padding:1cqw;border-width:max(2px,.5cqw)}
.bb-bh{font-size:2cqw}
.bb-led{font-size:3.6cqw;margin:.8cqw 0 1cqw;padding-top:.7cqw;padding-bottom:.7cqw}
.bb-row{gap:1.1cqw;margin-top:.8cqw}
.bb-row b{font-size:3cqw}
.lamp{width:3.1cqw}
.bb-slots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.bb-slots span{width:54px;height:62px;border:3px solid var(--cyan);display:flex;align-items:center;justify-content:center;
  font-family:var(--px);font-size:24px;color:var(--yel);background:#0b0528;box-shadow:inset 0 0 12px rgba(0,240,255,.25)}
.bb-slots.err{animation:shake .25s}
.bb-log{list-style:none;margin:0 0 12px;padding:6px;height:190px;overflow-y:auto;background:#020109;border:2px solid var(--line)}
.bb-log li{display:grid;grid-template-columns:38px 1fr auto;gap:8px;font-family:var(--px);font-size:11px;padding:6px 4px;border-bottom:1px dashed #1d1447}
.bb-log .no{color:var(--dim)} .bb-log .g{letter-spacing:5px}
.bb-log .s{color:var(--yel)} .bb-log .b{color:var(--grn)} .bb-log .o{color:var(--red)}
.bb-log .ph{display:block;color:#4b4380;font-family:var(--kr);font-size:13px;text-align:center;padding:70px 0}
.bb-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.bb-pad .btn{padding:13px 0;font-size:13px}
.bb-pad .btn:disabled{opacity:.25;cursor:default}
.bb-pad .w2{grid-column:span 2} .bb-pad .w3{grid-column:span 3}

/* ---------- minesweeper ---------- */
.ms-wrap{overflow-x:auto;padding-bottom:4px}
.ms-board{display:grid;gap:0;margin:0 auto;width:max-content;border:3px solid #000;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.ms-cell{width:var(--cs);height:var(--cs);padding:0;border:2px solid;border-color:#5b4bbd #1a0f4a #1a0f4a #5b4bbd;background:#33238a;
  font-family:var(--px);font-size:calc(var(--cs)*.42);line-height:1;display:flex;align-items:center;justify-content:center;color:#fff}
.ms-cell.open{background:#0d0730;border:1px solid #1e1454;cursor:default}
.ms-cell.mine{background:#3a0612} .ms-cell.boom{background:var(--red)} .ms-cell.wrong{background:#5a3a00}
.ms-cell.n1{color:#4fc3ff}.ms-cell.n2{color:var(--grn)}.ms-cell.n3{color:#ff5c7a}.ms-cell.n4{color:#b388ff}
.ms-cell.n5{color:#ffb300}.ms-cell.n6{color:var(--cyan)}.ms-cell.n7{color:#fff}.ms-cell.n8{color:#aaa}

/* ---------- sichuan ---------- */
.sc-wrap{overflow-x:auto}
.sc-board{position:relative;display:grid;margin:0 auto;width:max-content;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sc-board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.sc-e{min-width:0;min-height:0}
.tile{margin:1px;padding:0;border:1px solid #9a8b5c;border-radius:5px;background:linear-gradient(#fffdf0,#efe6c4);
  box-shadow:0 3px 0 #2f8f5b,0 4px 0 #1b5c39;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Noto Serif KR','Batang','Songti SC','SimSun','Malgun Gothic',serif;font-weight:700;line-height:1;color:#1a1a1a;overflow:hidden}
.tile span{display:block;font-size:calc(var(--cs)*.40)}
.tile .big{font-size:calc(var(--cs)*.62)}
.tile.man .s{color:#c21818}
.tile.pin{color:#0b4fb3} .tile.sou{color:#0d7a2c}
.tile.wind{color:#111} .tile.d-red{color:#c21818} .tile.d-grn{color:#0d7a2c}
.tile.d-wht .big{color:#0b4fb3;border:2px solid #0b4fb3;border-radius:3px;font-size:calc(var(--cs)*.44);padding:2px 3px}
.tile.sel{background:linear-gradient(#fff36b,#ffc400);transform:translateY(-2px);box-shadow:0 5px 0 #b06a00,0 0 12px var(--yel)}
.tile.hint{box-shadow:0 3px 0 #2f8f5b,0 0 0 3px var(--mag),0 0 14px var(--mag)}
.tile.bad{animation:shake .25s}
.sc-cover{position:absolute;inset:0;z-index:6;background:#050214;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center;border-radius:6px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:900;background:rgba(3,1,14,.86);display:flex;padding:14px;overflow-y:auto}
.mbox{margin:auto;width:100%;max-width:400px;background:var(--panel);border:3px solid var(--mag);padding:22px 18px;text-align:center;
  box-shadow:0 0 30px rgba(255,43,214,.45);animation:pop .2s}
.mbox h2{font-family:var(--px);font-size:18px;margin:0 0 14px;line-height:1.5}
.mbox .big{font-family:var(--px);font-size:30px;margin:6px 0 14px}
.mbox dl{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0 0 16px;font-size:14px;text-align:left}
.mbox dt{color:var(--dim)} .mbox dd{margin:0;text-align:right}
.mbox input{width:100%;font-family:var(--kr);font-size:18px;text-align:center;padding:10px;background:#050214;border:2px solid var(--cyan);color:var(--yel);margin-bottom:10px}
.mbox input.err{animation:shake .25s;border-color:var(--red)}
.mbox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.mbox .msg{min-height:20px;font-size:13px;color:var(--grn);margin:6px 0 0}

@media (max-width:560px){
  .screen{padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
  .btn{font-size:10px;padding:12px 12px;min-height:42px}
  .btn.kr{font-size:14px}
  .topbar{margin-bottom:14px}
  .cabs{gap:14px}
  .cab .scr{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-align:left;padding:10px 12px;margin:10px 10px 8px}
  .cab .ico{grid-row:span 2;font-size:34px;height:auto}
  .cab h3{margin:0;font-size:19px}
  .cab p{min-height:0}
  .cab .btn{margin:4px 10px 10px}
  .cab .lb{margin:0 10px}
  .ghead{gap:6px;margin-bottom:6px}
  .ghead h2{font-size:20px;min-width:0;text-align:center}
  .help{margin-bottom:6px}
  .diffs{margin-bottom:8px}
  .diffs .btn{flex:1}
  /* 스크롤해도 시간·점수가 보이도록 상단 고정 */
  .hud{position:sticky;top:0;z-index:20;gap:4px;margin-bottom:8px;background:var(--bg)}

  .bb-scene{margin-bottom:8px;border-width:2px;max-width:max(260px,calc(34vh * 1.83))}
  
  .bb-ctl{grid-template-columns:1fr;grid-template-areas:"slots" "log" "pad"}
  .bb-ctl .bb-slots{margin-bottom:8px}
  .bb-ctl .bb-log{height:92px;min-height:0;margin-bottom:8px}
  .bb-slots span{height:50px}
  .bb-pad{gap:6px}
  .bb-pad .btn{padding:0;min-height:48px;font-size:15px}
  .ms-board{border-width:2px}
  .mbox{padding:18px 14px}
  .mbox .row .btn{flex:1}
}
@media (max-height:480px) and (orientation:landscape){
  .help,.foot{display:none}

}

<script>
/* =====================================================================
   ★ 온라인 랭킹 설정 ★
   Firebase 콘솔에서 발급받은 웹 앱 설정값을 아래에 붙여넣으세요.
   projectId 가 비어 있으면 이 브라우저(localStorage)에만 기록이 저장됩니다.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCKYehDPAGTGzZ8lMtk8DpMlcTfbtBzeks",
  authDomain: "mini-game-b525a.firebaseapp.com",
  projectId: "mini-game-b525a",
  storageBucket: "mini-game-b525a.firebasestorage.app",
  messagingSenderId: "128250220606",
  appId: "1:128250220606:web:144828c3e9a1245ada816f"
};
const FIREBASE_VERSION = "10.12.2";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtTime(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* 안쪽 여백을 뺀 실제 사용 가능 폭 */
function innerW(e){ const s=getComputedStyle(e); return e.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight); }
/* 세로로 긴 화면(휴대폰)에서는 가로로 긴 판을 세워서 배치한다 */
const isNarrow=stage=>innerW(stage)<560;
const store={
  mem:{}, // localStorage 를 쓸 수 없는 환경에서는 탭이 열려 있는 동안만 기억
  get(k){ try{ const v=localStorage.getItem(k); return v===null&&k in this.mem?this.mem[k]:v; }catch(e){ return k in this.mem?this.mem[k]:null; } },
  set(k,v){ this.mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
const DIFF_LABEL={easy:'쉬움',normal:'보통',hard:'어려움'};
const DIFF_TAG={easy:'EASY',normal:'NORM',hard:'HARD'};

/* ---------- sound (Web Audio, 8-bit) ---------- */
const SFX={
  ctx:null, muted:store.get('arcade_mute')==='1',
  init(){
    if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume();
  },
  tone(f,d,delay=0,type='square',v=.05){
    if(this.muted||!this.ctx) return;
    const t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+d+.02);
  },
  play(n){
    switch(n){
      case 'click': this.tone(660,.05); break;
      case 'coin': this.tone(988,.08); this.tone(1319,.25,.08); break;
      case 'pitch': [700,560,430,320].forEach((f,i)=>this.tone(f,.06,i*.05,'triangle',.07)); break;
      case 'ok': this.tone(784,.07); this.tone(1047,.12,.07); break;
      case 'bad': this.tone(160,.18,0,'sawtooth',.06); break;
      case 'flag': this.tone(440,.06,0,'triangle',.08); break;
      case 'boom': [220,180,140,100,70].forEach((f,i)=>this.tone(f,.14,i*.07,'sawtooth',.08)); break;
      case 'win': [523,659,784,1047,784,1047,1319].forEach((f,i)=>this.tone(f,.14,i*.11)); break;
      case 'lose': [392,330,262,196].forEach((f,i)=>this.tone(f,.22,i*.18,'triangle',.09)); break;
    }
  }
};

/* 서버가 응답하지 않을 때 무한 대기하지 않도록 제한 시간을 둔다 */
function withTimeout(p,ms=8000){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }

/* ---------- leaderboard (Firestore, falls back to localStorage) ---------- */
const LB={
  mode:'local', db:null, fs:null,
  async init(){
    if(!FIREBASE_CONFIG.projectId){ this.mode='local'; return; }
    try{
      const base=`https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
      const appMod=await import(base+'firebase-app.js');
      const fs=await import(base+'firebase-firestore.js');
      this.db=fs.getFirestore(appMod.initializeApp(FIREBASE_CONFIG));
      this.fs=fs; this.mode='online';
    }catch(e){ console.warn('Firebase 연결 실패, 로컬 저장으로 대체합니다.',e); this.mode='offline'; }
  },
  localTop(game){
    try{ return JSON.parse(store.get('arcade_scores_'+game)||'[]'); }catch(e){ return []; }
  },
  localAdd(game,entry){
    const a=this.localTop(game); a.push(entry);
    a.sort((x,y)=>y.score-x.score||x.createdAt-y.createdAt);
    store.set('arcade_scores_'+game,JSON.stringify(a.slice(0,20)));
  },
  /* 한 번 실패해도 다음 요청 때 다시 서버에 시도한다 */
  ok(){ if(this.mode!=='online'){ this.mode='online'; setBadge(); } },
  async top5(game){
    if(this.db){
      try{
        const {collection,query,orderBy,limit,getDocsFromServer}=this.fs;
        const snap=await withTimeout(getDocsFromServer(query(collection(this.db,'scores_'+game),orderBy('score','desc'),limit(5))));
        this.ok(); return snap.docs.map(d=>d.data());
      }catch(e){ console.warn('랭킹 불러오기 실패',e); this.mode='offline'; setBadge(); }
    }
    return this.localTop(game).slice(0,5);
  },
  /* returns true when saved online, false when saved only in this browser */
  async submit(game,entry){
    if(this.db){
      try{
        const {collection,addDoc}=this.fs;
        await withTimeout(addDoc(collection(this.db,'scores_'+game),entry));
        this.ok(); return true;
      }catch(e){ console.warn('온라인 등록 실패',e); this.mode='offline'; setBadge(); }
    }
    this.localAdd(game,entry); return false;
  }
};
function setBadge(){
  const b=$('#modeBadge');
  b.className='badge'+(LB.mode==='online'?'':LB.mode==='offline'?' off':' local');
  b.textContent=LB.mode==='online'?'ONLINE RANK':LB.mode==='offline'?'OFFLINE':'LOCAL RANK';
  b.title=LB.mode==='online'?'모든 플레이어와 공유되는 랭킹':LB.mode==='offline'?'서버 연결 실패 - 이 브라우저에만 저장됩니다':'이 브라우저에만 저장되는 랭킹';
}

/* =====================================================================
   GAME HOST : 화면 전환, 타이머, HUD, 결과 처리
   ===================================================================== */
const GAMES={};
const Host={
  id:null, game:null, diff:'easy', started:false, over:false, t0:0, elapsed:0, iv:null, paused:false, pauseAt:0,
  open(id){
    this.id=id; this.game=GAMES[id];
    $('#gTitle').textContent=this.game.name;
    $('#gHelp').textContent=this.game.help;
    $('#gHelpBox').open=window.innerWidth>=560; // 좁은 화면에서는 접어 두어 판을 넓게
    $('#diffs').classList.toggle('hidden',!this.game.hasDiff);
    showScreen('game'); this.restart();
  },
  restart(){
    clearInterval(this.iv); this.iv=null;
    this.started=false; this.over=false; this.elapsed=0; this.paused=false; this.paintPauseBtn();
    document.querySelectorAll('#diffs .btn').forEach(b=>b.classList.toggle('on',b.dataset.diff===this.diff));
    const st=$('#stage'); st.innerHTML='';
    this.game.start(st,this.diff);
    this.renderHud();
  },
  begin(){
    if(this.started||this.over) return;
    this.started=true; this.t0=performance.now();
    this.iv=setInterval(()=>{ if(this.paused) return; if(this.game.tick) this.game.tick(); if(!this.over) this.renderHud(); },100);
    this.paintPauseBtn();
  },
  seconds(){
    if(this.over) return this.elapsed;
    if(!this.started) return 0;
    return ((this.paused?this.pauseAt:performance.now())-this.t0)/1000;
  },
  /* 일시정지: 시간을 멈추고 판을 가린다(멈춘 채 판을 보며 생각하는 것 방지). auto=화면을 벗어나서 멈춘 경우 */
  pause(auto){
    if(!this.started||this.over||this.paused||!$('#game').classList.contains('active')) return;
    this.paused=true; this.pauseAt=performance.now(); this.renderHud(); this.paintPauseBtn();
    const ov=el('div','pause-ov'); ov.id='pauseOv';
    ov.append(el('div','neon-y blink pz-t','PAUSED'),
      el('p','pz-s',auto?'화면을 벗어나서 잠깐 멈췄어요.':'잠깐 멈췄어요.'),
      el('p','pz-s','TIME '+fmtTime(this.seconds())));
    const go=el('button','btn yel pz-b','▶ CONTINUE'); go.addEventListener('click',()=>{ SFX.init(); SFX.play('coin'); this.resume(); });
    ov.append(go); $('#stage').append(ov);
  },
  resume(){
    if(!this.paused) return;
    this.t0+=performance.now()-this.pauseAt; this.paused=false;
    const ov=$('#pauseOv'); if(ov) ov.remove();
    this.renderHud(); this.paintPauseBtn();
  },
  paintPauseBtn(){ const b=$('#pauseBtn'); if(!b) return; b.disabled=!this.started||this.over; b.textContent=this.paused?'▶':'II'; b.setAttribute('aria-label',this.paused?'계속하기':'일시정지'); },
  renderHud(){
    const hud=$('#hud'); hud.innerHTML='';
    this.game.hud().forEach(([k,v])=>{ const d=el('div'); d.append(el('small','',k),el('b','',String(v))); hud.append(d); });
  },
  toast(msg){
    const st=$('#stage'); const old=st.querySelector('.toast'); if(old) old.remove();
    const t=el('div','toast',msg); st.append(t); setTimeout(()=>t.remove(),1400);
  },
  finish(win,rows){
    if(this.over) return;
    this.elapsed=this.seconds(); this.over=true; this.paused=false;
    const ov=$('#pauseOv'); if(ov) ov.remove(); this.paintPauseBtn();
    clearInterval(this.iv); this.iv=null;
    this.renderHud();
    const score=win?this.game.score():0;
    SFX.play(win?'win':'lose');
    setTimeout(()=>showResult(win,score,rows||[]),win?500:900);
  },
  leave(){
    clearInterval(this.iv); this.iv=null; this.over=true; this.id=null; this.paused=false;
    $('#stage').innerHTML=''; showScreen('home'); refreshBoards();
  }
};

const bbImgs={}; let bbLoaded=0, bbImgReady=false, bbBgCache=null;
const bbRedraw=()=>{ const g=typeof GAMES!=='undefined'&&GAMES.baseball; if(g&&g.ctx) g.drawScene(); };
for(const k in BB_PARTS){ const im=new Image(); im.onload=()=>{ if(++bbLoaded===Object.keys(BB_PARTS).length){ bbImgReady=true; bbBgCache=null; bbRedraw(); } }; im.src=BB_PARTS[k].src; bbImgs[k]=im; }
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ bbBgCache=null; bbRedraw(); });

const BB_FONT="'Press Start 2P', monospace";
function bbText(c,t,x,y,size,col,shadow){
  c.font=size+'px '+BB_FONT; c.textAlign='center'; c.textBaseline='middle';
  if(shadow){ c.fillStyle=shadow; c.fillText(t,x+1.4,y+1.4); }
  c.fillStyle=col; c.fillText(t,x,y);
}
/* 광고판: 이미지와 같은 모양으로 덮고 문구만 바꾼다 */
function bbBanner(c,x0,y0,x1,y1,bg,border,txt,size,col){
  c.fillStyle=border; c.fillRect(x0,y0,x1-x0,y1-y0);
  c.fillStyle=bg; c.fillRect(x0+2,y0+2,x1-x0-4,y1-y0-4);
  c.fillStyle='rgba(255,255,255,.2)'; c.fillRect(x0+2,y0+2,x1-x0-4,2);
  c.fillStyle='rgba(0,0,0,.15)'; c.fillRect(x0+2,y1-4,x1-x0-4,2);
  bbText(c,txt,(x0+x1)/2,(y0+y1)/2+1,size,col,'#1c2340');
}
function bbBackground(){
  if(bbBgCache) return bbBgCache;
  const cv=document.createElement('canvas'); cv.width=BBW*2; cv.height=BBH*2; const c=cv.getContext('2d');
  c.imageSmoothingEnabled=false; c.drawImage(bbImgs.plate,0,0,BBW*2,BBH*2); c.setTransform(2,0,0,2,0,0);
  // PITCHER 줄의 (L)을 BATTER 줄의 (R) 글자로 덮는다
  c.drawImage(bbImgs.plate,756,9,44,24,756,36,44,24);
  // 실제 회사 이름이 적힌 광고판 4곳은 같은 디자인의 다른 문구로 덮는다
  bbBanner(c,150,127,336,152,'#4b76ce','#22305e','PIXEL ARCADE',13,'#f3d55b');
  bbBanner(c,691,127,879,152,'#4a74cf','#22305e','NUMBER BALL',13,'#f3d55b');
  bbBanner(c,242,187,369,203,'#5f7bc0','#2c3b6c','PIXEL ARCADE',8,'#ffffff');
  bbBanner(c,657,187,781,203,'#c65852','#7a2a26','NUMBER BALL',8,'#ffffff');
  return bbBgCache=cv;
}
function bbLamp(c,x,y,r,on,col){
  c.fillStyle='#000'; c.beginPath(); c.arc(x,y,r+1.3,0,Math.PI*2); c.fill();
  c.fillStyle=on?col:'#3b3b3b'; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
  if(on){ c.fillStyle='rgba(255,255,255,.25)'; c.beginPath(); c.arc(x,y,r+3.5,0,Math.PI*2); c.fill(); c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); }
  c.fillStyle=on?'rgba(255,255,255,.6)':'rgba(255,255,255,.12)'; c.fillRect(x-r*.55,y-r*.55,r*.45,r*.45);
}
/* 전광판: 가운데는 크게 S/B/O + 이번 투구 숫자, 왼쪽 위는 INNING/OUTS, 오른쪽 위 작은 S/B/O도 같이 */
function bbLive(c,st){
  const cover=(x0,y0,x1,y1,col)=>{ c.fillStyle=col; c.fillRect(x0,y0,x1-x0,y1-y0); };

function bbBall(c,x,y,r){
  c.fillStyle='#1a1a1a'; c.beginPath(); c.arc(x,y,r+1.2,0,Math.PI*2); c.fill();
  c.fillStyle='#f7f7f2'; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill();
  if(r>4){ c.fillStyle='#d23a2a'; c.fillRect(x-r*.6,y-r*.45,1.6,r*.9); c.fillRect(x+r*.45,y-r*.45,1.6,r*.9); }
  c.fillStyle='rgba(255,255,255,.9)'; c.fillRect(x-r*.45,y-r*.55,Math.max(1,r*.35),Math.max(1,r*.3));
}
/* e: 투구 시작 후 지난 시간(ms), 음수면 대기 화면. st: 전광판 상태 */
function bbRender(c,e,homer,st){
  c.setTransform(1,0,0,1,0,0); c.imageSmoothingEnabled=false;
  if(!bbImgReady){ c.fillStyle='#3f8a3a'; c.fillRect(0,0,c.canvas.width,c.canvas.height); return; }
  c.drawImage(bbBackground(),0,0,c.canvas.width,c.canvas.height);
  c.setTransform(c.canvas.width/BBW,0,0,c.canvas.height/BBH,0,0);
  bbLive(c,st||{s:0,b:0,o:0,outs:0,inning:1});
  const rel=[501,243], hit=[470,350];
  if(e>=300&&e<735){ const u=(e-300)/435, v=u*(.55+.45*u); bbBall(c,rel[0]+(hit[0]-rel[0])*v,rel[1]+(hit[1]-rel[1])*v-Math.sin(u*Math.PI)*12,1.8+6.4*u*u); }
  if(homer){
    if(e>=735&&e<830){ const u=(e-735)/95; c.strokeStyle=`rgba(255,226,80,${1-u})`; c.lineWidth=3;
      for(let i=0;i<8;i++){ const a=i*Math.PI/4, r0=6+u*10, r1=14+u*22; c.beginPath(); c.moveTo(hit[0]+Math.cos(a)*r0,hit[1]+Math.sin(a)*r0); c.lineTo(hit[0]+Math.cos(a)*r1,hit[1]+Math.sin(a)*r1); c.stroke(); } }
    if(e>=735&&e<1500){ const u=(e-735)/765; bbBall(c,hit[0]+380*u,hit[1]-380*u+120*u*u,Math.max(1.5,8.2-6.5*u)); }
  }else if(e>=735&&e<820){ const u=(e-735)/85; bbBall(c,hit[0]+20*u,hit[1]+90*u,8.2+1.5*u); }
}

function lineClear(g,r1,c1,r2,c2){
  if(r1===r2){ for(let c=Math.min(c1,c2)+1;c<Math.max(c1,c2);c++) if(g[r1][c]) return false; return true; }
  if(c1===c2){ for(let r=Math.min(r1,r2)+1;r<Math.max(r1,r2);r++) if(g[r][c1]) return false; return true; }
  return false;
}
/* 두 패를 꺾임 2번 이하로 잇는 경로(꼭짓점 배열)를 돌려준다. 없으면 null */
function findPath(g,a,b){
  const [ar,ac]=a,[br,bc]=b, H=g.length, W=g[0].length;
  if(lineClear(g,ar,ac,br,bc)) return [a,b];
  for(const [r,c] of [[ar,bc],[br,ac]]){
    if(!g[r][c]&&lineClear(g,ar,ac,r,c)&&lineClear(g,r,c,br,bc)) return [a,[r,c],b];
  }
  let best=null,bestLen=Infinity;
  for(const [dr,dc] of [[0,1],[0,-1],[1,0],[-1,0]]){
    let r=ar+dr,c=ac+dc;
    while(r>=0&&r<H&&c>=0&&c<W&&!g[r][c]){
      const y=dr===0?[br,c]:[r,bc];
      if(!(y[0]===r&&y[1]===c)&&!g[y[0]][y[1]]&&lineClear(g,r,c,y[0],y[1])&&lineClear(g,y[0],y[1],br,bc)){
        const len=Math.abs(r-ar)+Math.abs(c-ac)+Math.abs(y[0]-r)+Math.abs(y[1]-c)+Math.abs(br-y[0])+Math.abs(bc-y[1]);
        if(len<bestLen){ bestLen=len; best=[a,[r,c],y,b]; }
      }
      r+=dr; c+=dc;
    }
  }
  return best;
}
function findAnyPair(g){
  const by={};
  for(let r=0;r<g.length;r++) for(let c=0;c<g[0].length;c++) if(g[r][c]) (by[g[r][c]]=by[g[r][c]]||[]).push([r,c]);
  for(const k in by){ const p=by[k];
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){ const path=findPath(g,p[i],p[j]); if(path) return {a:p[i],b:p[j],path}; }
  }
  return null;
}
function greedySolvable(g){
  const t=g.map(r=>r.slice()); let left=0; t.forEach(r=>r.forEach(v=>{ if(v) left++; }));
  while(left){ const p=findAnyPair(t); if(!p) return false; t[p.a[0]][p.a[1]]=0; t[p.b[0]][p.b[1]]=0; left-=2; }
  return true;
}

GAMES.sichuan={
  name:'사천성', en:'SICHUAN', icon:'🀄', hasDiff:true,
  desc:'같은 패를 이어서 모두 없애라!',
  help:'같은 그림의 패 두 장을 3개 이하의 직선(꺾임 2번 이하)으로 이을 수 있으면 사라집니다. 제한 시간 안에 모두 없애세요. 잘못 고르거나 힌트·셔플을 쓰면 감점!',
  cfg:{
    easy:{r:6,c:8,kinds:12,mult:1,limit:180},
    normal:{r:8,c:12,kinds:24,mult:2.5,limit:420},
    hard:{r:8,c:16,kinds:32,mult:4,limit:600}
  },
  start(stage,diff){
    const base=this.cfg[diff], narrow=isNarrow(stage);
    const k=this.k=(narrow&&base.c>base.r)?{...base,r:base.c,c:base.r}:base;
    this.ratio=narrow?1.16:1.28; // 패의 세로/가로 비율
    this.miss=0; this.hints=0; this.shuf=0; this.sel=null; this.hint=null; this.left=k.r*k.c; this.line=null;
    const bag=[]; for(let i=1;i<=k.kinds;i++) bag.push(i,i,i,i);
    for(let t=0;t<300;t++){
      shuffle(bag); this.g=[];
      for(let r=0;r<k.r+2;r++){ const row=[]; for(let c=0;c<k.c+2;c++) row.push(r&&c&&r<=k.r&&c<=k.c?bag[(r-1)*k.c+c-1]:0); this.g.push(row); }
      if(greedySolvable(this.g)) break;
    }
    const wrap=el('div','sc-wrap'); const bd=this.board=el('div','sc-board');
    this.layout();
    bd.addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(t&&!Host.over&&Host.started) this.pick(+t.dataset.r,+t.dataset.c); });
    wrap.append(bd);
    const tools=el('div','tools');
    const hb=el('button','btn kr','💡 힌트 (-200)'), sb=el('button','btn kr','🔀 셔플 (-300)');
    hb.addEventListener('click',()=>this.useHint()); sb.addEventListener('click',()=>this.useShuffle());
    tools.append(hb,sb);
    const cover=this.cover=el('div','sc-cover');
    const st=el('button','btn yel','▶ START');
    st.addEventListener('click',()=>{ SFX.play('coin'); cover.remove(); Host.begin(); });
    cover.append(el('div','neon-c',DIFF_LABEL[diff]+' · '+k.r+'×'+k.c+' · 제한 '+fmtTime(k.limit)),st);
    stage.append(wrap,tools,cover);
    this.render();
  },
  layout(){
    const st=$('#stage'), k=this.k, bd=this.board;
    // 판 전체가 한 화면에 들어오도록: 화면 높이에서 판 위쪽 영역과 아래 버튼 높이를 뺀다
    const availH=window.innerHeight-(st.getBoundingClientRect().top+window.scrollY)-96;
    const fitH=Math.floor(availH/(k.r*this.ratio+.8));
    const cs=clamp(Math.min(fitH,Math.floor(innerW(st)/(k.c+.8))),24,56), ring=Math.round(cs*.4), th=Math.round(cs*this.ratio);
    bd.style.setProperty('--cs',cs+'px');
    bd.style.gridTemplateColumns=`${ring}px repeat(${k.c},${cs}px) ${ring}px`;
    bd.style.gridTemplateRows=`${ring}px repeat(${k.r},${th}px) ${ring}px`;
  },
  render(){
    const bd=this.board,g=this.g; bd.innerHTML='';
    for(let r=0;r<g.length;r++) for(let c=0;c<g[0].length;c++){
      const v=g[r][c]; let e;
      if(v){
        const k=TILE_KINDS[v-1]; e=el('button','tile '+k.cls);
        if(k.big){ e.append(el('span','big',k.big)); e.setAttribute('aria-label',k.big); }
        else{ e.append(el('span','n',k.n),el('span','s',k.s)); e.setAttribute('aria-label',k.n+k.s); }
        if(this.sel&&this.sel[0]===r&&this.sel[1]===c) e.classList.add('sel');
        if(this.hint&&this.hint.some(p=>p[0]===r&&p[1]===c)) e.classList.add('hint');
      }else e=el('div','sc-e');
      e.dataset.r=r; e.dataset.c=c; bd.append(e);
    }
    if(this.line) this.drawLine(this.line);
  },
  cellAt(r,c){ return this.board.children[r*this.g[0].length+c]; },
  drawLine(path){
    const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg'), pl=document.createElementNS(ns,'polyline');
    pl.setAttribute('points',path.map(([r,c])=>{ const e=this.cellAt(r,c); return (e.offsetLeft+e.offsetWidth/2)+','+(e.offsetTop+e.offsetHeight/2); }).join(' '));
    pl.setAttribute('fill','none'); pl.setAttribute('stroke','#ff2bd6'); pl.setAttribute('stroke-width','5');
    pl.setAttribute('stroke-linecap','round'); pl.setAttribute('stroke-linejoin','round');
    pl.style.filter='drop-shadow(0 0 5px #ff2bd6)';
    svg.append(pl); this.board.append(svg);
  },
  pick(r,c){
    this.hint=null;
    if(!this.sel){ this.sel=[r,c]; SFX.play('click'); return this.render(); }
    const [sr,sc]=this.sel;
    if(sr===r&&sc===c){ this.sel=null; SFX.play('click'); return this.render(); }
    const path=this.g[sr][sc]===this.g[r][c]?findPath(this.g,[sr,sc],[r,c]):null;
    if(!path){
      this.miss++; this.sel=null; SFX.play('bad'); this.render();
      [this.cellAt(sr,sc),this.cellAt(r,c)].forEach(e=>e.classList.add('bad'));
      return Host.renderHud();
    }
    this.g[sr][sc]=0; this.g[r][c]=0; this.left-=2; this.sel=null; SFX.play('ok');
    this.line=path; this.render();
    const mine=path; setTimeout(()=>{ if(this.line===mine){ this.line=null; const s=this.board.querySelector('svg'); if(s) s.remove(); } },260);
    if(this.left===0){
      const remain=Math.max(0,this.k.limit-Host.seconds());
      return Host.finish(true,[['난이도',DIFF_LABEL[Host.diff]+' (×'+this.k.mult+')'],['남은 시간',fmtTime(remain)],['잘못 고름',this.miss+'회'],['힌트 / 셔플',this.hints+'회 / '+this.shuf+'회']]);
    }
    if(!findAnyPair(this.g)){ this.reshuffle(); Host.toast('NO MOVES - SHUFFLE!'); }
    Host.renderHud();
  },
  reshuffle(){
    const pos=[],vals=[];
    this.g.forEach((row,r)=>row.forEach((v,c)=>{ if(v){ pos.push([r,c]); vals.push(v); } }));
    for(let t=0;t<300;t++){
      shuffle(vals); pos.forEach(([r,c],i)=>this.g[r][c]=vals[i]);
      if(findAnyPair(this.g)) break;
    }
    this.sel=null; this.hint=null; this.render();
  },
  useHint(){
    if(Host.over||!Host.started) return;
    const p=findAnyPair(this.g); if(!p) return;
    this.hints++; this.hint=[p.a,p.b]; this.sel=null; SFX.play('flag'); this.render(); Host.renderHud();
  },
  useShuffle(){
    if(Host.over||!Host.started) return;
    this.shuf++; SFX.play('flag'); this.reshuffle(); Host.renderHud();
  },
  tick(){ if(!Host.over&&Host.seconds()>=this.k.limit){ Host.finish(false,[['사유','시간 초과'],['남은 패',this.left+'장']]); } },
  score(){
    const remain=Math.max(0,this.k.limit-Host.seconds());
    return Math.round(this.k.mult*Math.max(100,3000+remain*20-this.miss*50-this.hints*200-this.shuf*300));
  },
  hud(){ return [['TIME',fmtTime(Math.ceil(Math.max(0,this.k.limit-Host.seconds())))],['MISS',this.miss],['SCORE',this.score()]]; },
  shareLines(){ return ['🀄 '+DIFF_LABEL[Host.diff]+' · '+fmtTime(Host.elapsed)+' 만에 '+(this.k.r*this.k.c)+'장 모두 제거','실수 '+this.miss+' · 힌트 '+this.hints+' · 셔플 '+this.shuf]; }
};

/* =====================================================================
   UI : 화면 전환, 메인 랭킹, 결과 모달
   ===================================================================== */
/* =====================================================================
   ★ 광고 설정 ★
   show:false 로 바꾸면 광고 자리가 모두 사라집니다.
   광고 서비스(예: Google AdSense)에서 받은 광고 단위 코드를 home / result 에 문자열로 붙여넣으세요.
   비어 있으면 "광고 영역" 점선 상자만 보입니다.
   - home   : 메인 화면 맨 위 (게임 고르기 전)
   - result : 게임 결과 창 맨 위 배너 (resultBanner:true 일 때만. 전면 광고와 겹치지 않게 기본은 꺼 둠)
   게임 중 화면과 숫자패드·판 근처에는 실수 클릭 방지를 위해 광고를 두지 않습니다.

   전면 광고(interstitial): 결과 창에서 RETRY/MENU를 누를 때, 아래 두 조건을 모두 만족하면 한 번 띄웁니다.
   - everyGames : 지난 전면 광고 뒤로 이만큼 판을 끝냈을 때 (기본 3판)
   - minGapSec  : 지난 전면 광고(또는 사이트 접속) 뒤로 이만큼 시간이 지났을 때 (기본 180초)
   실제 광고: 구글 H5 게임 광고(Ad Placement API) 승인 후 안내받은 설정 코드를 <head>에 넣으면
   window.adBreak 가 생기고, 자동으로 그 광고를 띄웁니다.
   그 전까지는 placeholder:true 면 "전면 광고 영역" 화면을 잠깐 보여 주고, false면 아무것도 띄우지 않습니다.
   ===================================================================== */
const ADS={
  show:true,
  home:'',
  result:'',
  resultBanner:false,
  interstitial:{ show:true, everyGames:3, minGapSec:180, placeholder:true }
};
/* 전면 광고 관리: 판 수와 시간을 세다가 다음 판으로 넘어가는 순간에만 띄운다 */
const AdBreak={
  games:0, lastAt:Date.now(),
  noteGame(){ this.games++; },
  due(){ const c=ADS.interstitial; return !!(ADS.show&&c&&c.show&&this.games>=c.everyGames&&(Date.now()-this.lastAt)/1000>=c.minGapSec); },
  run(next){
    if(!this.due()){ next(); return; }
    this.games=0; this.lastAt=Date.now();
    const wasMuted=SFX.muted; SFX.muted=true;   // 광고 소리와 겹치지 않게 효과음을 잠깐 끈다
    let finished=false; const done=()=>{ if(finished) return; finished=true; SFX.muted=wasMuted; next(); };
    if(typeof window.adBreak==='function'){
      try{ window.adBreak({type:'next',name:'game-end',adBreakDone:done}); }catch(e){ done(); }
      return;
    }
    if(ADS.interstitial.placeholder) this.placeholder(done); else done();
  },
  /* 광고 서비스를 연결하기 전 확인용 화면: 3초 뒤 닫기 버튼이 켜진다 */
  placeholder(done){
    const ov=el('div','ad-inter'); ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','광고');
    const box=el('div','ad-slot ad-inter-box'); box.append(el('span','','전면 광고 영역'));
    const close=el('button','btn ad-inter-close','3'); close.disabled=true;
    ov.append(box,close); document.body.append(ov);
    let n=3; const iv=setInterval(()=>{ n--; if(n>0){ close.textContent=String(n); return; }
      clearInterval(iv); close.disabled=false; close.textContent='닫기 ✕'; close.focus(); },1000);
    close.addEventListener('click',()=>{ if(close.disabled) return; ov.remove(); done(); });
  }
};
function renderAd(slot,key){
  if(!slot) return;
  slot.classList.toggle('off',!ADS.show);
  if(!ADS.show) return;
  const code=(ADS[key]||'').trim();
  slot.innerHTML='';
  if(!code){ slot.classList.remove('filled'); slot.append(el('span','','광고 영역')); return; }
  slot.classList.add('filled'); slot.innerHTML=code;
  // innerHTML로 넣은 <script>는 실행되지 않으므로 다시 만들어 실행한다
  slot.querySelectorAll('script').forEach(old=>{ const s=document.createElement('script'); [...old.attributes].forEach(a=>s.setAttribute(a.name,a.value)); s.textContent=old.textContent; old.replaceWith(s); });
  if(slot.querySelector('ins.adsbygoogle')){ try{ (window.adsbygoogle=window.adsbygoogle||[]).push({}); }catch(e){} }
}

const GAME_IDS=['baseball','minesweeper','sichuan'];
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  window.scrollTo(0,0);
}
function buildHome(){
  const box=$('#cabs');
  const colors=['neon-y','neon-c','neon-m'];
  GAME_IDS.forEach((id,i)=>{
    const g=GAMES[id], cab=el('article','cab');
    cab.append(el('div','marquee '+colors[i],g.en));
    const scr=el('div','scr'); scr.append(el('div','ico',g.icon),el('h3','',g.name),el('p','',g.desc));
    const play=el('button','btn yel','▶ PLAY'); play.addEventListener('click',()=>{ SFX.init(); SFX.play('coin'); Host.open(id); });
    const lb=el('div','lb'); lb.append(el('h4','','★ TOP 5 ★')); const ol=el('ol'); ol.id='lb-'+id; lb.append(ol);
    cab.append(scr,play,lb); box.append(cab);
  });
}
function renderBoard(id,rows){
  const ol=$('#lb-'+id); ol.innerHTML='';
  const rk=['1ST','2ND','3RD','4TH','5TH'];
  for(let i=0;i<5;i++){
    const r=rows[i], li=el('li',r?'':'empty');
    li.append(el('span','rk',rk[i]),el('span','nm',r?String(r.name):'- - -'),
      el('span','df',r&&DIFF_TAG[r.difficulty]?DIFF_TAG[r.difficulty]:''),el('span','sc',r?Number(r.score).toLocaleString():''));
    ol.append(li);
  }
}
async function refreshBoards(){
  await Promise.all(GAME_IDS.map(async id=>renderBoard(id,await LB.top5(id))));
}

function showResult(win,score,rows){
  if(Host.id===null) return; // 이미 메뉴로 나감
  const box=$('#mbox'); box.innerHTML='';
  const gameId=Host.id, diff=Host.game.hasDiff?Host.diff:'-', timeSec=Math.round(Host.elapsed*10)/10;
  AdBreak.noteGame();
  if(ADS.resultBanner){ const ad=el('div','ad-slot'); ad.setAttribute('role','complementary'); ad.setAttribute('aria-label','광고'); box.append(ad); renderAd(ad,'result'); }
  box.append(el('h2',win?'neon-y':'neon-m',win?'STAGE CLEAR!':'GAME OVER'));
  if(win){ box.append(el('div','big neon-c',score.toLocaleString())); }
  if(rows.length){ const dl=el('dl'); rows.forEach(([k,v])=>dl.append(el('dt','',k),el('dd','',v))); box.append(dl); }
  const msg=el('p','msg','');
  let inp=null,reg=null;
  if(win){
    inp=el('input'); inp.maxLength=8; inp.placeholder='닉네임 (최대 8자)'; inp.value=store.get('arcade_nick')||''; inp.setAttribute('aria-label','닉네임');
    reg=el('button','btn yel','기록 등록'); reg.classList.add('kr');
    const submit=async()=>{
      const name=inp.value.trim().slice(0,8);
      if(!name){ inp.classList.remove('err'); void inp.offsetWidth; inp.classList.add('err'); SFX.play('bad'); return; }
      reg.disabled=true; inp.disabled=true; msg.textContent='등록 중...';
      store.set('arcade_nick',name);
      const online=await LB.submit(gameId,{name,score,difficulty:diff,timeSec,createdAt:Date.now()});
      SFX.play('coin');
      msg.textContent=online?'등록 완료! 랭킹에 반영되었습니다.':(LB.mode==='offline'?'서버 연결 실패 - 이 브라우저에만 저장했습니다.':'등록 완료! (이 브라우저에 저장)');
      reg.textContent='등록됨';
    };
    reg.addEventListener('click',submit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!reg.disabled) submit(); e.stopPropagation(); });
    box.append(inp,reg);
    // SNS 공유: 휴대폰은 기본 공유창(카카오톡·문자 등), 지원하지 않으면 결과 문구를 복사
    const share=el('button','btn mag kr share','📤 결과 공유하기');
    share.addEventListener('click',async()=>{
      SFX.play('click');
      const url=/^https?:$/.test(location.protocol)?location.origin+location.pathname:'';
      const text=['🕹️ PIXEL ARCADE · '+GAMES[gameId].name,...GAMES[gameId].shareLines(),'🏆 '+score.toLocaleString()+'점','너도 도전해 봐!'].join('\n');
      if(navigator.share){
        try{ await navigator.share(url?{title:'PIXEL ARCADE',text,url}:{title:'PIXEL ARCADE',text}); msg.textContent='공유했어요!'; return; }
        catch(e){ if(e&&e.name==='AbortError') return; }
      }
      const full=url?text+'\n'+url:text;
      let ok=false;
      try{ await navigator.clipboard.writeText(full); ok=true; }catch(e){}
      if(!ok){ const ta=el('textarea'); ta.value=full; ta.style.cssText='position:fixed;opacity:0'; document.body.append(ta); ta.select(); try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); }
      msg.textContent=ok?'결과를 복사했어요. 원하는 곳에 붙여넣기 하세요!':'복사하지 못했어요. 화면을 캡처해서 공유해 주세요.';
    });
    box.append(share);
  }else{
    box.append(el('p','','클리어해야 기록을 등록할 수 있어요.'));
  }
  box.append(msg);
  const row=el('div','row');
  const again=el('button','btn','RETRY'), menu=el('button','btn mag','MENU');
  // 다음 판으로 넘어가는 순간: 조건이 맞으면 전면 광고를 먼저 보여 준다
  again.addEventListener('click',()=>{ closeModal(); AdBreak.run(()=>Host.restart()); });
  menu.addEventListener('click',()=>{ closeModal(); AdBreak.run(()=>Host.leave()); });
  row.append(again,menu); box.append(row);
  $('#modal').classList.remove('hidden');
  (inp||again).focus();
}
function closeModal(){ $('#modal').classList.add('hidden'); }

/* ---------- global events ---------- */
function startFromIntro(){
  if(!$('#intro').classList.contains('active')) return;
  SFX.init(); SFX.play('coin');
  $('#intro .credit').textContent='CREDIT 01';
  setTimeout(()=>showScreen('home'),350);
}
$('#intro').addEventListener('click',startFromIntro);
document.addEventListener('keydown',e=>{
  if($('#intro').classList.contains('active')){ if(!e.ctrlKey&&!e.metaKey&&!e.altKey) startFromIntro(); return; }
  if(!$('#modal').classList.contains('hidden')) return;
  if(Host.paused) return;
  if(Host.id==='baseball'&&$('#game').classList.contains('active')){
    const g=GAMES.baseball;
    if(/^[0-9]$/.test(e.key)){ g.input(+e.key); e.preventDefault(); }
    else if(e.key==='Backspace'){ g.del(); e.preventDefault(); }
    else if(e.key==='Enter'){ g.enter(); e.preventDefault(); }
  }
});
$('#backBtn').addEventListener('click',()=>{ SFX.play('click'); Host.leave(); });
$('#pauseBtn').addEventListener('click',()=>{ SFX.play('click'); if(Host.paused) Host.resume(); else Host.pause(false); });
/* 다른 앱으로 가거나 화면을 끄면 자동 일시정지 (지하철에서 내릴 때 시간이 흐르지 않게) */
document.addEventListener('visibilitychange',()=>{ if(document.hidden) Host.pause(true); });
window.addEventListener('pagehide',()=>Host.pause(true));
$('#retryBtn').addEventListener('click',()=>{ SFX.play('click'); Host.restart(); });
$('#diffs').addEventListener('click',e=>{
  const b=e.target.closest('[data-diff]'); if(!b) return;
  SFX.play('click'); Host.diff=b.dataset.diff; Host.restart();
});
/* 화면 회전·창 크기 변경 시 판 크기를 다시 맞춘다 */
let resizeTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ if(Host.id&&Host.game.layout&&$('#game').classList.contains('active')) Host.game.layout(); },150);
});
function paintMute(){ $('#muteBtn').textContent=SFX.muted?'SOUND OFF':'SOUND ON'; }
$('#muteBtn').addEventListener('click',()=>{
  SFX.muted=!SFX.muted; store.set('arcade_mute',SFX.muted?'1':'0'); paintMute(); SFX.init(); SFX.play('click');
});

/* ---------- boot ---------- */
buildHome(); paintMute(); setBadge(); renderAd($('#adHome'),'home');
GAME_IDS.forEach(id=>renderBoard(id,LB.localTop(id).slice(0,5)));
LB.init().then(()=>{ setBadge(); refreshBoards(); });
</script>
